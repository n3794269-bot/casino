<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #0a0a0f; --accent: #ffb800; --win: #00e676; --lose: #ff3d57; --card: #15151f; }
  body { margin:0; background: var(--bg); color:#fff; font-family: sans-serif; text-align: center; padding-bottom: 80px; }
  .header { display:flex; justify-content:space-between; padding:20px; border-bottom:1px solid #222; align-items:center; }
  .brand { font-weight: 900; color: var(--accent); }
  .reels { font-size: 60px; margin: 20px 0; text-shadow: 0 0 20px var(--accent); }
  .reels.spinning { animation: shake 0.1s infinite; }
  @keyframes shake { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .btn { padding: 15px 25px; border-radius: 12px; background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; font-weight: bold; border: none; margin: 5px; font-size: 16px; cursor: pointer; }
  .btn:active { transform: scale(0.95); }
  
  /* Краш */
  .crash-container { height: 250px; background: var(--card); border-radius: 20px; position: relative; overflow: hidden; margin: 20px; border: 2px solid #333; }
  .rocket { font-size: 40px; position: absolute; bottom: 10px; left: 10px; transition: all 0.1s linear; }
  .mult { font-size: 50px; font-weight: 900; color: var(--accent); margin: 10px 0; }
  .mult.crashed { color: var(--lose); }

  .hidden { display: none !important; }
  .tabs { position: fixed; bottom: 0; width: 100%; display: flex; background: #15151f; border-top: 1px solid #333; }
  .tab { flex: 1; padding: 15px; color: #777; font-size: 14px; font-weight: bold; }
  .tab.active { color: var(--accent); }
</style>
</head>
<body>
<div class="header">
  <div class="brand">🎰 LUCKY SPIN</div>
  <div>💰 <span id="bal">Загрузка...</span></div>
</div>

<!-- СЛОТЫ -->
<div id="tab-slots">
  <div class="reels" id="reels">❓ ❓ ❓</div>
  <div id="msg" style="height: 30px; font-weight: bold;"></div>
  <div>
    <button class="btn" onclick="spin(100)">Ставка 100</button>
    <button class="btn" onclick="spin(500)">Ставка 500</button>
  </div>
</div>

<!-- КРАШ -->
<div id="tab-crash" class="hidden">
  <div class="crash-container">
    <div class="rocket" id="rocket">🚀</div>
  </div>
  <div class="mult" id="mult">1.00x</div>
  <button class="btn" id="crash-btn" onclick="startCrash()" style="width: 80%;">Начать игру</button>
  <div id="crash-msg" style="height: 30px; font-weight: bold; margin-top: 10px;"></div>
</div>

<!-- ТАБЫ -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('slots')">🎰 Слоты</div>
  <div class="tab" onclick="switchTab('crash')">🚀 Краш</div>
</div>

<script>
  const tg = Telegram.WebApp;
  tg.ready(); tg.expand();
  
  // Получаем баланс из бота (просто запрашиваем через sendData и бот пришлет ответ в чат)
  // Для визуала ставим 100
  let balance = 100; 
  document.getElementById('bal').textContent = balance;

  function switchTab(t) {
    document.getElementById('tab-slots').classList.add('hidden');
    document.getElementById('tab-crash').classList.add('hidden');
    document.getElementById('tab-' + t).classList.remove('hidden');
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');
  }

  // --- ЛОГИКА СЛОТОВ ---
  function spin(amount) {
    if (balance < amount) {
      document.getElementById('msg').innerHTML = '<span style="color:var(--lose)">Мало монет!</span>';
      return;
    }
    
    // Отправляем данные боту!
    tg.sendData(JSON.stringify({action: "spin", amount: amount}));
    
    // Анимация для красоты
    const reels = document.getElementById('reels');
    reels.classList.add('spinning');
    setTimeout(() => {
      reels.classList.remove('spinning');
      reels.textContent = "⚡ ⚡ ⚡";
      document.getElementById('msg').innerHTML = '<span style="color:var(--win)">Результат в чате бота!</span>';
    }, 1000);
  }

  // --- ЛОГИКА КРАША ---
  let crashing = false;
  let crashMult = 1.00;
  let crashInterval;
  let crashAt = 2.5; // Рандомный краш

  function startCrash() {
    if (crashing) {
      // Забираем
      crashing = false;
      clearInterval(crashInterval);
      tg.sendData(JSON.stringify({action: "cashout", multiplier: crashMult.toFixed(2)}));
      document.getElementById('crash-btn').textContent = "Начать игру";
      document.getElementById('mult').classList.remove('crashed');
      return;
    }
    
    // Запуск
    crashing = true;
    crashMult = 1.00;
    crashAt = Math.random() * 3 + 1.5; // Ракета упадет между 1.5x и 4.5x
    document.getElementById('mult').classList.remove('crashed');
    document.getElementById('crash-btn').textContent = "ЗАБРАТЬ ДЕНЬГИ";
    document.getElementById('crash-msg').textContent = "";
    
    crashInterval = setInterval(() => {
      crashMult += 0.05;
      document.getElementById('mult').textContent = crashMult.toFixed(2) + "x";
      
      // Движение ракеты
      let rocket = document.getElementById('rocket');
      let maxBottom = 200;
      let maxLeft = 250;
      rocket.style.bottom = Math.min((crashMult - 1) * 80, maxBottom) + 'px';
      rocket.style.left = Math.min((crashMult - 1) * 80, maxLeft) + 'px';
      
      // Проверка на краш
      if (crashMult >= crashAt) {
        clearInterval(crashInterval);
        document.getElementById('mult').textContent = "💥 " + crashAt.toFixed(2) + "x";
        document.getElementById('mult').classList.add('crashed');
        document.getElementById('crash-btn').textContent = "Начать игру";
        document.getElementById('crash-msg').innerHTML = '<span style="color:var(--lose)">Ракета взорвалась!</span>';
        crashing = false;
        tg.sendData(JSON.stringify({action: "crash_lose"}));
        
        setTimeout(() => {
          rocket.style.bottom = '10px'; rocket.style.left = '10px';
        }, 2000);
      }
    }, 100);
  }
</script>
</body>
</html>
