<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@600;800&display=swap');

  :root {
    --bg: #0a1128;
    --blue-light: #1a3b6e;
    --gold: #ffd700;
    --text: #fff;
    --win: #00ff88;
    --lose: #ff3333;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  
  body { 
    font-family: 'Montserrat', sans-serif; 
    background: radial-gradient(circle at 50% 0%, var(--blue-light) 0%, var(--bg) 80%);
    color: var(--text); 
    padding-bottom: 70px; 
    min-height: 100vh;
    overflow: hidden;
  }

  /* Верхняя панель */
  .header { 
    position: absolute; top: 0; left: 0; right: 0; z-index: 50; 
    padding: 15px 20px; 
    background: linear-gradient(to bottom, rgba(10,17,40,0.9), transparent);
    display: flex; justify-content: space-between; align-items: center; 
  }
  .logo { font-family: 'Cinzel', serif; font-size: 20px; color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.5); }
  .balance-box { font-size: 16px; font-weight: 800; color: var(--gold); background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 5px; border: 1px solid var(--gold); }

  /* ЭКРАН СЛОТА */
  #tab-slots { position: relative; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  
  .slot-machine-bg {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      linear-gradient(rgba(10,17,40,0.7), rgba(10,17,40,0.9)),
      url('https://images.unsplash.com/photo-1600861194942-f883de0dfe96?q=80&w=1000&auto=format&fit=crop');
    background-size: cover; background-position: center;
    z-index: -1;
  }

  /* Сетка барабанов */
  .reels-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 5px;
    background: #050a18;
    padding: 10px;
    border-radius: 10px;
    border: 4px solid var(--gold);
    box-shadow: 0 0 30px rgba(255,215,0,0.2), inset 0 0 20px #000;
    width: 90%;
    max-width: 400px;
    height: 350px;
    margin-bottom: 20px;
    position: relative;
  }

  .cell {
    background: linear-gradient(135deg, #0e1e40, #081021);
    border-radius: 5px;
    display: flex; justify-content: center; align-items: center;
    font-size: 35px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    border: 1px solid rgba(255,255,255,0.05);
    text-shadow: 0 0 10px rgba(0,255,255,0.3);
  }
  
  /* Анимация вращения */
  .reels-grid.spinning .cell { animation: blur 0.1s infinite; }
  @keyframes blur { 0%,100% { filter: blur(0); transform: translateY(0); } 50% { filter: blur(2px); transform: translateY(-5px); } }

  /* Выигрышная линия */
  .win-line {
    position: absolute;
    top: 50%; left: 0; width: 100%; height: 2px;
    background: var(--win); box-shadow: 0 0 10px var(--win);
    opacity: 0; transition: opacity 0.3s;
  }
  .win-line.active { opacity: 1; }

  /* Кнопки ставок снизу */
  .bet-panel {
    display: flex; gap: 10px; width: 90%; max-width: 400px;
    background: rgba(0,0,0,0.7); padding: 10px; border-radius: 15px;
    border: 2px solid #1a3b6e;
  }
  .bet-btn {
    flex: 1; padding: 15px 0; border-radius: 8px;
    background: linear-gradient(to bottom, #1e4a8a, #0a1f40);
    border: 1px solid var(--gold); color: var(--gold);
    font-weight: 900; font-size: 16px; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    transition: 0.1s;
  }
  .bet-btn:active { transform: scale(0.95); box-shadow: 0 0 15px var(--gold); }

  .msg { text-align: center; padding: 15px; font-size: 18px; font-weight: 800; min-height: 30px; text-transform: uppercase; margin-top: 10px; }
  .win-text { color: var(--win); text-shadow: 0 0 10px var(--win); } .lose-text { color: var(--lose); }

  /* Нижнее меню (табы) */
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: rgba(5,10,24,0.95); backdrop-filter: blur(10px); border-top: 1px solid #1a3b6e; display: flex; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); }
  .tab { flex: 1; text-align: center; cursor: pointer; font-size: 10px; color: #555; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; text-transform: uppercase; }
  .tab-icon { font-size: 20px; } .tab.active { color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.5); }

  /* Скрытие лишних вкладок для этого дизайна */
  .hidden { display: none !important; }

  /* Профиль */
  .profile-card { padding: 30px; border-radius: 12px; background: rgba(10,17,40,0.9); border: 1px solid var(--gold); text-align: center; margin: 20px; box-shadow: 0 0 20px rgba(255,215,0,0.2); }
  .profile-bal { font-family: 'Cinzel', serif; font-size: 52px; font-weight: 900; color: var(--gold); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">⚡ ZEUS VS HADES</div>
  <div class="balance-box"><span>💰</span> <span id="bal">0</span></div>
</div>

<!-- ЭКРАН СЛОТА -->
<div id="tab-slots">
  <div class="slot-machine-bg"></div>
  
  <h2 style="font-family:'Cinzel'; color:var(--gold); margin-bottom:10px; text-shadow: 0 0 15px rgba(255,215,0,0.5);">ИГРАТЬ</h2>
  
  <div class="reels-grid" id="reels">
    <!-- 15 ячеек (5x3) -->
    <div class="cell" id="c0">⚡</div><div class="cell" id="c1">🏺</div><div class="cell" id="c2">🦅</div><div class="cell" id="c3">👑</div><div class="cell" id="c4">🏛️</div>
    <div class="cell" id="c5">🏛️</div><div class="cell" id="c6">👑</div><div class="cell" id="c7">⚡</div><div class="cell" id="c8">🏺</div><div class="cell" id="c9">🦅</div>
    <div class="cell" id="c10">🦅</div><div class="cell" id="c11">⚡</div><div class="cell" id="c12">🏛️</div><div class="cell" id="c13">👑</div><div class="cell" id="c14">🏺</div>
    
    <div class="win-line" id="win-line"></div>
  </div>

  <div class="msg" id="slot-msg"></div>

  <div class="bet-panel">
    <button class="bet-btn" onclick="spin(100)">100</button>
    <button class="bet-btn" onclick="spin(500)">500</button>
    <button class="bet-btn" onclick="spin(1000)">1000</button>
    <button class="bet-btn" onclick="spin(5000)">5000</button>
  </div>
</div>

<!-- ПРОФИЛЬ -->
<div id="tab-profile" class="hidden">
  <div class="profile-card">
    <div style="color:#888; font-size:14px; letter-spacing:2px; margin-bottom:10px;">БАЛАНС</div>
    <div class="profile-bal" id="prof-bal">0</div>
    <div style="color:var(--gold); font-size:14px; margin-top:10px;">МОНЕТ</div>
  </div>
  <button class="bet-btn" style="width:90%; margin:0 auto; display:block; padding:20px;" onclick="tg.close()">Выйти в бот</button>
</div>

<!-- ТАБЫ -->
<div class="tabs">
  <div class="tab active" data-tab="slots" onclick="switchTab('slots')"><span class="tab-icon">🎰</span>Слоты</div>
  <div class="tab" data-tab="profile" onclick="switchTab('profile')"><span class="tab-icon">👤</span>Профиль</div>
</div>

<script>
  const tg = window.Telegram?.WebApp || { ready: ()=>{}, expand: ()=>{}, close: ()=>{}, showAlert: alert, sendData: ()=>{} };
  tg.ready(); tg.expand();

  let balance = 0;
  const urlParams = new URLSearchParams(window.location.search);
  
  if (urlParams.has('bal')) {
      balance = parseInt(urlParams.get('bal'));
      localStorage.setItem('zeus_balance', balance);
  } else {
      balance = parseInt(localStorage.getItem('zeus_balance')) || 0;
  }

  function updateBal() {
      localStorage.setItem('zeus_balance', balance); 
      document.getElementById("bal").textContent = balance.toLocaleString('ru'); 
      document.getElementById("prof-bal").textContent = balance.toLocaleString('ru');
  }

  // Сохранение при выходе
  window.addEventListener('beforeunload', () => {
      tg.sendData(JSON.stringify({action: "sync", balance: balance}));
  });

  function switchTab(t) {
      document.querySelectorAll(".content > div, #tab-slots, #tab-profile").forEach(d => d.classList.add("hidden"));
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      document.getElementById("tab-"+t).classList.remove("hidden");
      document.querySelector('.tab[data-tab="'+t+'"]').classList.add("active");
  }

  // СИМВОЛЫ (Можно заменить на картинки богов)
  const SYMBOLS = ["⚡", "🏛️", "👑", "🏺", "🦅"];
  let currentSpins = parseInt(localStorage.getItem('zeus_spins')) || 0;

  function spin(amount) {
    if (balance < amount) return document.getElementById("slot-msg").innerHTML = '<span class="lose-text">НЕДОСТАТОЧНО СРЕДСТВ</span>';
    
    balance -= amount; updateBal();
    const grid = document.getElementById("reels");
    const msg = document.getElementById("slot-msg");
    const winLine = document.getElementById("win-line");
    
    msg.textContent = ""; winLine.classList.remove("active");
    grid.classList.add("spinning");
    
    // Анимация смены символов
    let speed = 50;
    let ticks = 0;
    let interval = setInterval(() => {
        for (let i = 0; i < 15; i++) {
            document.getElementById("c"+i).textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        }
        ticks++;
        if (ticks > 20) {
            clearInterval(interval);
            grid.classList.remove("spinning");
            checkWin(amount);
        }
    }, speed);
  }

  function checkWin(amount) {
    // ХАНИПОТ: 8 спинов везет, потом слив
    let winChance = currentSpins < 8 ? 0.85 : 0.15;
    let isWin = Math.random() < winChance;
    
    const msg = document.getElementById("slot-msg");
    const winLine = document.getElementById("win-line");
    
    // Генерируем финальную сетку
    let finalSymbols = [];
    if (isWin) {
        // Генерируем выигрышную комбинацию (3 одинаковых в центре)
        let winSym = SYMBOLS[Math.floor(Math.random() * 3)]; // Дорогие символы
        for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 5; c++) {
                // Центральная линия выигрывает
                if (r === 1) finalSymbols.push(winSym);
                else finalSymbols.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
            }
        }
    } else {
        // Проигрышная сетка
        for (let i = 0; i < 15; i++) {
            finalSymbols.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
        }
    }

    // Отрисовываем
    for (let i = 0; i < 15; i++) {
        document.getElementById("c"+i).textContent = finalSymbols[i];
    }

    if (isWin) {
        winLine.classList.add("active");
        let mult = Math.floor(Math.random() * 3) + 3; // x3 - x5
        let payout = amount * mult;
        balance += payout; updateBal();
        msg.innerHTML = `<span class="win-text">ВЫИГРЫШ +${payout} (x${mult})</span>`;
    } else {
        msg.innerHTML = `<span class="lose-text">ПРОИГРЫШ -${amount}</span>`;
    }
    
    currentSpins++;
    localStorage.setItem('zeus_spins', currentSpins);
    updateBal();
  }

  updateBal();
</script>
</body>
</html>
