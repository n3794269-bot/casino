<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Royal Casino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1120; --panel: #151e32; --text: #f8fafc; --muted: #64748b; --accent: #38bdf8;
  --success: #10b981; --danger: #ef4444; --gold: #fbbf24;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 70px; overflow-x: hidden; }

.header { position: sticky; top: 0; z-index: 50; padding: 15px 20px; background: rgba(11, 17, 32, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 20px; font-weight: 900; letter-spacing: 1px; color: var(--accent); text-shadow: 0 0 10px rgba(56,189,248,0.5); }
.balance-box { display: flex; align-items: center; gap: 6px; background: var(--panel); padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); font-weight: 800; font-size: 15px; }

.screen { display: none; padding: 20px; max-width: 500px; margin: 0 auto; animation: fadeIn 0.3s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
h2 { font-size: 22px; font-weight: 800; margin-bottom: 15px; }
.games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.game-card { background: var(--panel); border-radius: 16px; padding: 20px; cursor: pointer; text-align: center; transition: 0.2s; border: 1px solid rgba(255,255,255,0.02); }
.game-card:active { transform: scale(0.97); background: #1e293b; }
.game-card h3 { font-size: 16px; margin-bottom: 5px; }
.game-card p { font-size: 11px; color: var(--muted); }
.game-icon { font-size: 32px; margin-bottom: 10px; }

.btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; color: #000; background: var(--accent); box-shadow: 0 0 15px rgba(56,189,248,0.4); margin-bottom: 10px; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; box-shadow: none; cursor: not-allowed; }
.btn-green { background: var(--success); box-shadow: 0 0 15px rgba(16,185,129,0.4); color: #fff; }
.btn-red { background: var(--danger); box-shadow: 0 0 15px rgba(239,68,68,0.4); color: #fff; }
.back-btn { background: none; border: none; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 15px; }
.panel { background: var(--panel); border-radius: 16px; padding: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }

.bet-controls { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-radius: 10px; padding: 5px; margin-bottom: 15px; }
.bet-controls button { width: 40px; height: 40px; border-radius: 8px; border: none; background: var(--panel); color: #fff; font-size: 20px; cursor: pointer; }
.bet-controls input { width: 80px; background: transparent; border: none; color: #fff; font-size: 18px; font-weight: 800; text-align: center; }
.msg { text-align: center; font-size: 14px; font-weight: 600; min-height: 20px; margin-top: 10px; }
.msg.win { color: var(--success); } .msg.lose { color: var(--danger); }

/* ===== СЛОТЫ (ИСПРАВЛЕНО) ===== */
.theme-switch { display: flex; gap: 8px; margin-bottom: 15px; }
.theme-switch button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--panel); background: var(--bg); color: var(--muted); font-weight: 800; cursor: pointer; }
.theme-switch button.active { background: var(--accent); color: #000; border-color: var(--accent); }

.slot-machine { background: radial-gradient(circle at center, #1e293b, #0b1120); border-radius: 16px; padding: 8px; border: 2px solid var(--accent); box-shadow: inset 0 0 30px #000, 0 0 20px rgba(56,189,248,0.2); margin-bottom: 15px; position: relative; }

.reels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; height: 240px; /* 3 ряда по 80px */ }
.reel { background: #0f172a; border-radius: 8px; overflow: hidden; position: relative; height: 100%; border: 1px solid rgba(255,255,255,0.05); }
.track { position: absolute; top: 0; left: 0; width: 100%; display: flex; flex-direction: column; }
.cell { width: 100%; height: 80px; display: flex; justify-content: center; align-items: center; font-size: 38px; flex-shrink: 0; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
.cell.win { animation: pulse 0.5s infinite alternate; background: rgba(56,189,248,0.2); }
@keyframes pulse { to { transform: scale(1.1); filter: brightness(1.5); } }
.win-line { position: absolute; top: 50%; left: 8px; right: 8px; height: 2px; background: var(--accent); box-shadow: 0 0 15px var(--accent); opacity: 0; transition: opacity 0.3s; transform: translateY(-50%); pointer-events: none; }
.win-line.active { opacity: 1; }

/* MINES */
.mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; }
.mine-cell { aspect-ratio: 1; background: var(--panel); border-radius: 10px; border: none; cursor: pointer; font-size: 24px; display: flex; justify-content: center; align-items: center; transition: 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
.mine-cell:active { transform: scale(0.95); }
.mine-cell.opened { background: #1e293b; }
.mine-cell.diamond { background: rgba(16,185,129,0.2); border: 1px solid var(--success); }
.mine-cell.bomb { background: rgba(239,68,68,0.2); border: 1px solid var(--danger); }

/* DICE */
.dice-result { font-size: 60px; font-weight: 900; text-align: center; margin: 20px 0; color: var(--accent); }
.slider-container { margin: 20px 0; }
.slider-container input { width: 100%; accent-color: var(--accent); }

/* CRASH */
.crash-canvas { width: 100%; height: 200px; background: var(--panel); border-radius: 12px; display: block; margin-bottom: 15px; }
.multiplier { font-size: 56px; font-weight: 900; text-align: center; color: var(--accent); text-shadow: 0 0 15px rgba(56,189,248,0.5); margin-bottom: 10px; }

/* NAV */
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(11,17,32,0.95); border-top: 1px solid rgba(255,255,255,0.05); display: flex; padding: 10px 0 max(10px, env(safe-area-inset-bottom)); z-index: 100; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: 700; color: var(--muted); cursor: pointer; }
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 20px; margin-bottom: 4px; }
.profile-bal { font-size: 48px; font-weight: 900; color: var(--gold); text-align: center; margin: 20px 0; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">♦ ROYAL</div>
  <div class="balance-box"><span>🪙</span> <span id="bal">0.00</span></div>
</div>

<!-- LOBBY -->
<div id="s-lobby" class="screen active">
  <h2>Игры</h2>
  <div class="games-grid">
    <div class="game-card" onclick="openGame('slots')"><div class="game-icon">🎰</div><h3>Слоты</h3><p>Зевс, Фараон</p></div>
    <div class="game-card" onclick="openGame('mines')"><div class="game-icon">💣</div><h3>Mines</h3><p>Мин 3, 5</p></div>
    <div class="game-card" onclick="openGame('dice')"><div class="game-icon">🎲</div><h3>Dice</h3><p>Больше/Меньше</p></div>
    <div class="game-card" onclick="openGame('crash')"><div class="game-icon">🚀</div><h3>Crash</h3><p>Забери до краша</p></div>
    <div class="game-card" onclick="openGame('profile')"><div class="game-icon">👤</div><h3>Профиль</h3><p>Баланс</p></div>
  </div>
</div>

<!-- SLOTS -->
<div id="s-slots" class="screen">
  <button class="back-btn" onclick="openGame('lobby')">← Назад</button>
  <div class="theme-switch" id="theme-switch">
    <button onclick="setTheme('zeus', this)" class="active">⚡ Зевс</button>
    <button onclick="setTheme('pharaoh', this)">🗿 Фараон</button>
  </div>
  <div class="slot-machine">
    <div class="reels" id="reels"></div>
    <div class="win-line" id="win-line"></div>
  </div>
  <div class="msg" id="slot-msg">Выбери ставку и крути</div>
  <div class="bet-controls">
    <button onclick="changeBet(-1)">−</button>
    <input type="text" id="slot-bet" value="1.00" readonly>
    <button onclick="changeBet(1)">+</button>
  </div>
  <button class="btn" id="spin-btn" onclick="spinSlots()">Крутить</button>
</div>

<!-- MINES -->
<div id="s-mines" class="screen">
  <button class="back-btn" onclick="openGame('lobby')">← Назад</button>
  <div class="panel">
    <div class="bet-controls">
      <button onclick="changeBet(-1)">−</button>
      <input type="text" id="mines-bet" value="1.00" readonly>
      <button onclick="changeBet(1)">+</button>
    </div>
    <div class="mines-grid" id="mines-grid"></div>
    <button class="btn" id="mines-btn" onclick="minesAction()">Играть</button>
    <div class="msg" id="mines-msg"></div>
  </div>
</div>

<!-- DICE -->
<div id="s-dice" class="screen">
  <button class="back-btn" onclick="openGame('lobby')">← Назад</button>
  <div class="panel">
    <div class="bet-controls">
      <button onclick="changeBet(-1)">−</button>
      <input type="text" id="dice-bet" value="1.00" readonly>
      <button onclick="changeBet(1)">+</button>
    </div>
    <div class="dice-result" id="dice-result">50.00</div>
    <div class="slider-container">
      <input type="range" id="dice-slider" min="2" max="98" value="50" oninput="updateDiceInfo()">
      <div style="display:flex; justify-content:space-between; margin-top:10px; font-weight:800;">
        <span id="dice-win-chance">Шанс: 50%</span>
        <span id="dice-mult">x1.98</span>
      </div>
    </div>
    <button class="btn btn-green" onclick="rollDice(true)">Больше</button>
    <button class="btn btn-red" onclick="rollDice(false)">Меньше</button>
    <div class="msg" id="dice-msg"></div>
  </div>
</div>

<!-- CRASH -->
<div id="s-crash" class="screen">
  <button class="back-btn" onclick="openGame('lobby')">← Назад</button>
  <div class="panel">
    <div class="multiplier" id="crash-mult">1.00x</div>
    <canvas id="crash-canvas" class="crash-canvas" width="600" height="300"></canvas>
    <div class="bet-controls">
      <button onclick="changeBet(-1)">−</button>
      <input type="text" id="crash-bet" value="1.00" readonly>
      <button onclick="changeBet(1)">+</button>
    </div>
    <button class="btn btn-green" id="crash-btn" onclick="crashAction()">Начать</button>
    <div class="msg" id="crash-msg"></div>
  </div>
</div>

<!-- PROFILE -->
<div id="s-profile" class="screen">
  <button class="back-btn" onclick="openGame('lobby')">← Назад</button>
  <div class="panel" style="text-align:center;">
    <div style="color:var(--muted); font-size:14px; font-weight:800;">БАЛАНС</div>
    <div class="profile-bal" id="prof-bal">0.00</div>
    <div style="color:var(--muted); font-size:12px;">Синхронизация с ботом: Авто</div>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <div class="nav-item active" onclick="openGame('lobby')"><span class="nav-icon">🏠</span>Лобби</div>
  <div class="nav-item" onclick="openGame('slots')"><span class="nav-icon">🎰</span>Слоты</div>
  <div class="nav-item" onclick="openGame('crash')"><span class="nav-icon">🚀</span>Краш</div>
  <div class="nav-item" onclick="openGame('profile')"><span class="nav-icon">👤</span>Профиль</div>
</div>

<script>
// --- TG INIT ---
const tg = window.Telegram?.WebApp || { ready:()=>{}, expand:()=>{}, close:()=>{}, sendData:()=>{}, CloudStorage: {setItem:(k,v,cb)=>cb&&cb(), getItem:(k,cb)=>cb&&cb(null)} };
tg.ready(); tg.expand();

// --- STATE ---
let balance = 1000;
let betIndex = 2;
const BETS = [0.1, 0.5, 1, 2, 5, 10, 25, 50];
let storageReady = false;

// --- CLOUD SYNC (АВТОСОХРАНЕНИЕ) ---
function saveCloud() {
    if (!storageReady) return;
    // Сохраняем в облако Telegram
    tg.CloudStorage.setItem('balance', balance.toString(), ()=>{});
    // Отправляем боту для обновления базы
    tg.sendData(JSON.stringify({action: "sync", balance: Math.floor(balance)}));
}

// Загрузка баланса при старте (исправлено от NaN)
tg.CloudStorage.getItem('balance', (err, val) => {
    let parsed = NaN;
    if (!err && val) parsed = parseFloat(val);
    if (!isNaN(parsed) && parsed >= 0) balance = parsed;
    else {
        const u = new URLSearchParams(location.search);
        balance = u.has('bal') ? parseFloat(u.get('bal')) : 1000;
    }
    storageReady = true;
    updateUI();
});

function updateUI() {
    document.getElementById('bal').textContent = balance.toFixed(2);
    if(document.getElementById('prof-bal')) document.getElementById('prof-bal').textContent = balance.toFixed(2);
    ['slot-bet', 'mines-bet', 'dice-bet', 'crash-bet'].forEach(id => {
        if(document.getElementById(id)) document.getElementById(id).value = BETS[betIndex].toFixed(2);
    });
    saveCloud();
}

function changeBet(dir) {
    betIndex = Math.max(0, Math.min(BETS.length - 1, betIndex + dir));
    updateUI();
}

function openGame(game) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('s-' + game).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    updateUI();
    if (game === 'slots') initSlots();
    if (game === 'mines') resetMines();
    if (game === 'crash') resetCrash();
}

// --- SLOTS GAME ---
const THEMES = {
    zeus: { s: ["⚡","🏛️","🍇","🏺","👑"], w: "⚡" },
    pharaoh: { s: ["🗿","☥","🪲","👁","🐫"], w: "🦁" }
};
let currentTheme = 'zeus';
let slotSpinning = false;

function setTheme(t, btn) {
    if(slotSpinning) return;
    currentTheme = t;
    document.querySelectorAll('#theme-switch button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    initSlots();
}

function initSlots() {
    const reelsContainer = document.getElementById('reels');
    reelsContainer.innerHTML = '';
    const theme = THEMES[currentTheme];
    for(let i=0; i<5; i++) {
        const reel = document.createElement('div');
        reel.className = 'reel';
        let html = '<div class="track" style="transform: translateY(0)">';
        // 3 символа изначально
        for(let j=0; j<3; j++) {
            let sym = theme.s[Math.floor(Math.random() * theme.s.length)];
            html += `<div class="cell">${sym}</div>`;
        }
        html += '</div>';
        reel.innerHTML = html;
        reelsContainer.appendChild(reel);
    }
    document.getElementById('slot-msg').textContent = 'Выбери ставку и крути';
    document.getElementById('win-line').classList.remove('active');
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('win'));
}

function spinSlots() {
    if(slotSpinning) return;
    const bet = BETS[betIndex];
    if (bet > balance) return alert('Мало средств!');
    
    balance -= bet; 
    updateUI();
    slotSpinning = true;
    document.getElementById('spin-btn').disabled = true;
    document.getElementById('slot-msg').textContent = 'Крутим...';
    document.getElementById('win-line').classList.remove('active');
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('win'));

    const theme = THEMES[currentTheme];
    // Шанс выигрыша 35% (первые 8 спинов можно сделать 85% для заманухи, но пока 35%)
    const isWin = Math.random() < 0.35; 
    let winAmount = 0;
    
    // Выбираем символ, который выпадет в центр (для выигрыша)
    const winSym = theme.s[Math.floor(Math.random() * 3)]; 

    const tracks = document.querySelectorAll('.track');
    
    tracks.forEach((track, i) => {
        // Генерируем 17 ячеек (15 для прокрутки + 2 видимых в конце)
        let html = '';
        for(let j=0; j<17; j++) {
            if (isWin && j === 15 && i === 2) {
                // Выигрышный символ ровно в центре третьего барабана
                html += `<div class="cell">${winSym}</div>`;
            } else {
                html += `<div class="cell">${theme.s[Math.floor(Math.random() * theme.s.length)]}</div>`;
            }
        }
        track.innerHTML = html;
        
        // Сброс анимации
        track.style.transition = 'none';
        track.style.transform = 'translateY(0)';
        
        // Принудительный рефлоу
        void track.offsetWidth;

        // Анимация прокрутки: сдвигаем так, чтобы 15-я ячейка (индекс 15) была первой видимой
        // Высота ячейки 80px. 15 * 80 = 1200px.
        setTimeout(() => {
            track.style.transition = 'transform 1s cubic-bezier(0.1, 0.7, 0.1, 1)';
            track.style.transform = `translateY(-1200px)`;
        }, i * 100);
    });

    setTimeout(() => {
        slotSpinning = false;
        document.getElementById('spin-btn').disabled = false;
        
        if(isWin) {
            winAmount = bet * 5;
            balance += winAmount;
            updateUI();
            document.getElementById('slot-msg').className = 'msg win';
            document.getElementById('slot-msg').textContent = `ВЫИГРЫШ: +${winAmount.toFixed(2)}!`;
            document.getElementById('win-line').classList.add('active');
            
            // Подсветка центрального ряда
            tracks.forEach(track => {
                const cells = track.querySelectorAll('.cell');
                if(cells[15]) cells[15].classList.add('win');
                if(cells[14]) cells[14].classList.add('win');
                if(cells[16]) cells[16].classList.add('win');
            });
        } else {
            document.getElementById('slot-msg').className = 'msg lose';
            document.getElementById('slot-msg').textContent = `Проигрыш -${bet.toFixed(2)}`;
        }
    }, 1600);
}

// --- MINES GAME ---
let minesActive = false;
let minesBombs = new Set();
let minesOpened = 0;
const minesTotal = 25;
const minesCount = 3;

function resetMines() {
    minesActive = false;
    minesBombs.clear();
    minesOpened = 0;
    const grid = document.getElementById('mines-grid');
    grid.innerHTML = '';
    for (let i = 0; i < minesTotal; i++) {
        const cell = document.createElement('button');
        cell.className = 'mine-cell';
        cell.id = 'mc-' + i;
        cell.onclick = () => clickMine(i);
        grid.appendChild(cell);
    }
    document.getElementById('mines-btn').className = 'btn';
    document.getElementById('mines-btn').textContent = 'Играть';
    document.getElementById('mines-msg').textContent = '';
    document.getElementById('mines-msg').className = 'msg';
}

function minesAction() {
    if (!minesActive) {
        let bet = BETS[betIndex];
        if (bet > balance) return alert('Мало средств!');
        balance -= bet; updateUI();
        minesActive = true;
        while(minesBombs.size < minesCount) minesBombs.add(Math.floor(Math.random() * minesTotal));
        document.querySelectorAll('.mine-cell').forEach(c => { c.className = 'mine-cell'; c.textContent = ''; });
        document.getElementById('mines-btn').className = 'btn btn-green';
        document.getElementById('mines-btn').textContent = 'Забрать';
    } else {
        if (minesOpened === 0) return alert('Откройте хотя бы одну!');
        let mult = 1 + (minesOpened * 0.3);
        let payout = BETS[betIndex] * mult;
        balance += payout; updateUI();
        minesActive = false;
        revealMines();
        document.getElementById('mines-btn').className = 'btn';
        document.getElementById('mines-btn').textContent = 'Играть снова';
        document.getElementById('mines-msg').className = 'msg win';
        document.getElementById('mines-msg').textContent = `Забрали ${payout.toFixed(2)} (x${mult.toFixed(1)})`;
    }
}

function clickMine(i) {
    if (!minesActive) return;
    let cell = document.getElementById('mc-' + i);
    if (cell.classList.contains('opened')) return;
    if (minesBombs.has(i)) {
        cell.classList.add('bomb', 'opened'); cell.textContent = '💣';
        minesActive = false; revealMines();
        document.getElementById('mines-btn').className = 'btn';
        document.getElementById('mines-btn').textContent = 'Играть снова';
        document.getElementById('mines-msg').className = 'msg lose';
        document.getElementById('mines-msg').textContent = 'Взрыв!';
    } else {
        cell.classList.add('diamond', 'opened'); cell.textContent = '💎';
        minesOpened++;
        document.getElementById('mines-msg').className = 'msg';
        document.getElementById('mines-msg').textContent = `Множитель: x${(1 + minesOpened * 0.3).toFixed(1)}`;
    }
}

function revealMines() {
    for (let i = 0; i < minesTotal; i++) {
        if (minesBombs.has(i)) {
            let c = document.getElementById('mc-' + i);
            c.classList.add('bomb', 'opened'); c.textContent = '💣';
        }
    }
}

// --- DICE GAME ---
function updateDiceInfo() {
    let val = document.getElementById('dice-slider').value;
    document.getElementById('dice-win-chance').textContent = `Шанс: ${val}%`;
    document.getElementById('dice-mult').textContent = `x${(99/val).toFixed(2)}`;
}

function rollDice(isHigher) {
    let bet = BETS[betIndex];
    if (bet > balance) return alert('Мало средств!');
    balance -= bet; updateUI();
    
    let target = parseFloat(document.getElementById('dice-slider').value);
    let roll = Math.random() * 100;
    
    let count = 0;
    let int = setInterval(() => {
        document.getElementById('dice-result').textContent = (Math.random() * 100).toFixed(2);
        if (++count > 10) {
            clearInterval(int);
            document.getElementById('dice-result').textContent = roll.toFixed(2);
            let win = isHigher ? (roll > target) : (roll < target);
            let mult = (99 / (isHigher ? 100 - target : target));
            if (win) {
                let payout = bet * mult; balance += payout; updateUI();
                document.getElementById('dice-msg').className = 'msg win';
                document.getElementById('dice-msg').textContent = `Выигрыш +${payout.toFixed(2)}`;
            } else {
                document.getElementById('dice-msg').className = 'msg lose';
                document.getElementById('dice-msg').textContent = `Проигрыш -${bet.toFixed(2)}`;
            }
        }
    }, 50);
}

// --- CRASH GAME ---
let crashActive = false, crashMult = 1.00, crashAt = 0, crashTimer = null, crashStartTime = 0;

function resetCrash() {
    crashActive = false; clearInterval(crashTimer);
    document.getElementById('crash-mult').textContent = '1.00x';
    document.getElementById('crash-mult').style.color = 'var(--accent)';
    document.getElementById('crash-btn').textContent = 'Начать';
    document.getElementById('crash-btn').className = 'btn btn-green';
    drawGraph(0, 1);
    document.getElementById('crash-msg').className = 'msg';
    document.getElementById('crash-msg').textContent = '';
}

function crashAction() {
    if (!crashActive) {
        let bet = BETS[betIndex];
        if (bet > balance) return alert('Мало средств!');
        balance -= bet; updateUI();
        crashActive = true; crashMult = 1.00;
        crashAt = Math.max(1.01, 0.99 / (1 - Math.random()));
        crashStartTime = performance.now();
        document.getElementById('crash-btn').textContent = 'ЗАБРАТЬ';
        document.getElementById('crash-btn').className = 'btn';
        
        crashTimer = setInterval(() => {
            let time = (performance.now() - crashStartTime) / 1000;
            crashMult = Math.pow(1.07, time * 2);
            if (crashMult >= crashAt) {
                clearInterval(crashTimer); crashActive = false;
                document.getElementById('crash-mult').textContent = crashAt.toFixed(2) + 'x';
                document.getElementById('crash-mult').style.color = 'var(--danger)';
                document.getElementById('crash-btn').textContent = 'Начать';
                document.getElementById('crash-btn').className = 'btn btn-green';
                document.getElementById('crash-msg').className = 'msg lose';
                document.getElementById('crash-msg').textContent = `Краш на ${crashAt.toFixed(2)}x!`;
            } else {
                document.getElementById('crash-mult').textContent = crashMult.toFixed(2) + 'x';
                drawGraph(time, crashMult);
            }
        }, 50);
    } else {
        clearInterval(crashTimer); crashActive = false;
        let payout = BETS[betIndex] * crashMult; balance += payout; updateUI();
        document.getElementById('crash-btn').textContent = 'Начать';
        document.getElementById('crash-btn').className = 'btn btn-green';
        document.getElementById('crash-msg').className = 'msg win';
        document.getElementById('crash-msg').textContent = `Забрали +${payout.toFixed(2)} на ${crashMult.toFixed(2)}x`;
    }
}

function drawGraph(time, mult) {
    const ctx = document.getElementById('crash-canvas').getContext('2d');
    const w = 600, h = 300;
    ctx.clearRect(0, 0, w, h);
    if (time === 0) return;
    ctx.beginPath();
    ctx.moveTo(0, h);
    let maxX = Math.max(2, time * 1.2), maxY = Math.max(2, mult * 1.2);
    for (let t = 0; t <= time; t += 0.05) {
        let m = Math.pow(1.07, t * 2);
        if (m > mult) break;
        ctx.lineTo((t / maxX) * w, h - (m / maxY) * h);
    }
    ctx.lineTo((time / maxX) * w, h - (mult / maxY) * h);
    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4; ctx.stroke();
}

openGame('lobby');
