<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Cinzel:wght@700;900&display=swap');

  :root {
    --winline-bg: #0b1120;
    --winline-card: #151e32;
    --winline-border: #23304d;
    --gold-text: #FFD700;
    --win: #00ff88;
    --lose: #ff3333;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  
  body { 
    font-family: 'Inter', sans-serif; 
    background: var(--winline-bg);
    color: #fff; 
    padding-bottom: 70px; 
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ШАПКА */
  .header { position: sticky; top: 0; z-index: 50; padding: 12px 15px; background: rgba(11, 17, 32, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--winline-border); display: flex; justify-content: space-between; align-items: center; }
  .brand { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 900; color: var(--gold-text); letter-spacing: 1px; }
  .balance-box { display: flex; align-items: center; gap: 6px; background: var(--winline-card); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--winline-border); color: #fff; font-weight: 700; font-size: 15px; }

  /* ЛОББИ (В СТИЛЕ WINLINE) */
  .lobby-title { text-align: center; margin: 25px 0 15px; font-size: 18px; font-weight: 800; letter-spacing: 0.5px; color: #fff; }
  .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 15px; }
  
  .game-card { 
    border-radius: 12px; overflow: hidden; position: relative; height: 140px; 
    background: var(--winline-card); border: 1px solid var(--winline-border); 
    cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; 
    transition: transform 0.1s; 
  }
  .game-card:active { transform: scale(0.97); border-color: #3b82f6; }
  
  .game-icon { font-size: 45px; margin-bottom: 10px; }
  .game-name { font-size: 14px; color: #fff; font-weight: 600; z-index: 2; }

  /* ЭКРАН СЛОТА (ФИОЛЕТОВЫЙ КАК НА СКРИНЕ) */
  #screen-slots { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; background: radial-gradient(circle at 50% 50%, #3b0a3b 0%, #1a021a 100%); }
  #screen-slots.active { display: flex; }

  /* Плашка Выигрыша */
  .win-banner { 
    background: linear-gradient(180deg, #4a1c4a, #2a0a2a); 
    border: 2px solid var(--gold-text); border-radius: 8px; 
    padding: 8px 40px; text-align: center; margin-bottom: 15px;
    box-shadow: 0 0 20px rgba(255,215,0,0.4);
  }
  .win-banner-title { font-size: 10px; color: #ff99ff; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
  .win-banner-value { font-family: 'Cinzel', serif; font-size: 24px; color: var(--gold-text); font-weight: 900; }

  /* Корпус с золотой рамкой */
  .slot-machine { 
    position: relative; width: 100%; max-width: 420px; 
    background: #2a0a2a; 
    border: 6px solid transparent; 
    border-image: linear-gradient(to bottom right, #FFD700, #FF8C00, #FFD700) 1;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.9);
    padding: 4px;
  }

  /* Сетка 6x5 */
  .reels-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 2px;
    background: #1a021a;
    height: 320px;
  }

  .cell {
    background: linear-gradient(135deg, #4a154b, #2d0a2d);
    display: flex; justify-content: center; align-items: center;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }
  
  /* Стили для КАРТИНОК вместо эмодзи */
  .symbol-img {
    width: 85%;
    height: 85%;
    object-fit: contain;
    /* Фильтр делает картинку золотой и светящейся */
    filter: drop-shadow(0 0 8px #ffd700) sepia(1) saturate(3) hue-rotate(-15deg) brightness(1.1);
    transition: transform 0.2s;
  }

  /* Анимация прокрутки */
  .reels-grid.spinning .symbol-img { animation: blur 0.1s infinite; }
  @keyframes blur { 0%,100% { filter: drop-shadow(0 0 8px #ffd700) blur(0); transform: translateY(0); } 50% { filter: drop-shadow(0 0 15px #ffd700) blur(2px); transform: translateY(-5px); } }

  /* Панель управления */
  .control-panel {
    width: 100%; max-width: 420px;
    background: linear-gradient(180deg, #1f0e1f, #0a040a);
    border: 2px solid #b8860b; border-top: none;
    padding: 15px; display: flex; justify-content: space-between; align-items: center;
  }
  .bet-btn { background: transparent; border: 1px solid #555; color: #aaa; padding: 10px; border-radius: 4px; font-weight: 800; cursor: pointer; }
  .bet-btn.active { border-color: var(--gold-text); color: var(--gold-text); background: rgba(255,215,0,0.1); }
  
  .spin-circle {
    width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle, #ffd700, #ff8c00);
    border: 3px solid #fff; color: #000; font-weight: 900; font-size: 16px;
    display: flex; justify-content: center; align-items: center;
    box-shadow: 0 0 20px rgba(255,215,0,0.8); cursor: pointer;
  }
  .spin-circle:active { transform: scale(0.9); }

  /* ОБЩИЕ СТИЛИ */
  .screen { display: none; padding: 20px; max-width: 500px; margin: 0 auto; }
  .screen.active { display: block; }
  .back-btn { background: var(--winline-card); border: 1px solid var(--winline-border); color: #fff; padding: 10px 15px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-bottom: 20px; }
  .msg { text-align: center; font-size: 16px; font-weight: 800; margin-top: 15px; text-transform: uppercase; }
  .win-text { color: var(--win); text-shadow: 0 0 10px var(--win); }
  .lose-text { color: var(--lose); }

  /* Табы */
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 150; background: var(--winline-bg); border-top: 1px solid var(--winline-border); display: flex; padding: 10px 0 max(10px, env(safe-area-inset-bottom)); }
  .tab { flex: 1; text-align: center; cursor: pointer; font-size: 11px; color: #666; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tab.active { color: #3b82f6; }
  .tab-icon { font-size: 20px; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">👑 ROYAL CASINO</div>
  <div class="balance-box"><span>💰</span> <span id="bal">0</span></div>
</div>

<!-- ЛОББИ -->
<div id="screen-lobby" class="screen active">
  <div class="lobby-title">Популярные игры</div>
  <div class="games-grid">
    <div class="game-card" onclick="openGame('zeus')">
      <div class="game-icon">⚡</div><div class="game-name">Zeus</div>
    </div>
    <div class="game-card" onclick="openGame('blackjack')">
      <div class="game-icon">🃏</div><div class="game-name">Блэкджек</div>
    </div>
    <div class="game-card" onclick="openGame('roulette')">
      <div class="game-icon">🎡</div><div class="game-name">Рулетка</div>
    </div>
    <div class="game-card" onclick="openGame('crash')">
      <div class="game-icon">🚀</div><div class="game-name">Краш</div>
    </div>
  </div>
</div>

<!-- СЛОТ -->
<div id="screen-slots" class="screen">
  <button class="back-btn" onclick="showScreen('lobby')">← В Лобби</button>
  
  <div class="win-banner">
    <div class="win-banner-title">ВЫИГРЫШ ЗА СПИН</div>
    <div class="win-banner-value" id="last-win">$0.00</div>
  </div>

  <div class="slot-machine">
    <div class="reels-grid" id="reels">
      <!-- 30 ячеек -->
      <div class="cell" id="c0"></div><div class="cell" id="c1"></div><div class="cell" id="c2"></div><div class="cell" id="c3"></div><div class="cell" id="c4"></div><div class="cell" id="c5"></div>
      <div class="cell" id="c6"></div><div class="cell" id="c7"></div><div class="cell" id="c8"></div><div class="cell" id="c9"></div><div class="cell" id="c10"></div><div class="cell" id="c11"></div>
      <div class="cell" id="c12"></div><div class="cell" id="c13"></div><div class="cell" id="c14"></div><div class="cell" id="c15"></div><div class="cell" id="c16"></div><div class="cell" id="c17"></div>
      <div class="cell" id="c18"></div><div class="cell" id="c19"></div><div class="cell" id="c20"></div><div class="cell" id="c21"></div><div class="cell" id="c22"></div><div class="cell" id="c23"></div>
      <div class="cell" id="c24"></div><div class="cell" id="c25"></div><div class="cell" id="c26"></div><div class="cell" id="c27"></div><div class="cell" id="c28"></div><div class="cell" id="c29"></div>
    </div>
  </div>

  <div class="control-panel">
    <div style="display:flex; flex-direction:column; gap:5px;">
      <button class="bet-btn" onclick="setBet(100, this)">100</button>
      <button class="bet-btn active" onclick="setBet(500, this)">500</button>
      <button class="bet-btn" onclick="setBet(1000, this)">1K</button>
    </div>
    <div class="spin-circle" onclick="spin()">СПИН</div>
  </div>
  
  <div class="msg" id="slot-msg"></div>
</div>

<!-- ЗАГЛУШКИ -->
<div id="screen-blackjack" class="screen"><button class="back-btn" onclick="showScreen('lobby')">← Назад</button><div class="msg">В разработке</div></div>
<div id="screen-roulette" class="screen"><button class="back-btn" onclick="showScreen('lobby')">← Назад</button><div class="msg">В разработке</div></div>
<div id="screen-crash" class="screen"><button class="back-btn" onclick="showScreen('lobby')">← Назад</button><div class="msg">В разработке</div></div>

<!-- ПРОФИЛЬ -->
<div id="screen-profile" class="screen">
  <div class="back-btn" style="display:block; text-align:center; margin-bottom:30px;">Баланс: <span id="prof-bal" style="color:var(--gold-text)">0</span></div>
  <button class="spin-circle" onclick="saveAndExit()" style="width:100%; border-radius: 8px; height: 50px; font-size: 16px;">СОХРАНИТЬ И ВЫЙТИ</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="showScreen('lobby')"><span class="tab-icon">🎰</span>Казино</div>
  <div class="tab" onclick="showScreen('profile')"><span class="tab-icon">👤</span>Профиль</div>
</div>

<script>
  const tg = window.Telegram?.WebApp || { ready: ()=>{}, expand: ()=>{}, close: ()=>{}, sendData: ()=>{} };
  tg.ready(); tg.expand();

  let balance = 0;
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('bal')) { balance = parseInt(urlParams.get('bal')); localStorage.setItem('royal_balance', balance); } 
  else { balance = parseInt(localStorage.getItem('royal_balance')) || 0; }

  function updateBal() {
      localStorage.setItem('royal_balance', balance); 
      document.getElementById("bal").textContent = balance.toLocaleString('ru'); 
      if(document.getElementById("prof-bal")) document.getElementById("prof-bal").textContent = balance.toLocaleString('ru');
  }

  function saveAndExit() {
      tg.sendData(JSON.stringify({action: "sync", balance: balance}));
      tg.close();
  }

  function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + screenId).classList.add('active');
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  }

  // БЕСПЛАТНЫЕ КАРТИНКИ С WIKIMEDIA (Стилизованы под золото через CSS)
  const SYMBOLS = [
    "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Diamond_icon.svg/512px-Diamond_icon.svg.png", // Кристалл
    "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Crown_icon.svg/512px-Crown_icon.svg.png",     // Корона
    "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Ring_icon.svg/512px-Ring_icon.svg.png",       // Кольцо
    "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Chalice_icon.svg/512px-Chalice_icon.svg.png", // Чаша
    "https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Lightning_icon.svg/512px-Lightning_icon.svg.png", // Молния
    "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Zeus_Otricoli_Pio-Clementino_Inv257.jpg/300px-Zeus_Otricoli_Pio-Clementino_Inv257.jpg" // Зевс (Скаттер)
  ];

  let currentBet = 500;
  let currentSpins = parseInt(localStorage.getItem('royal_spins')) || 0;

  function openGame(game) {
      if (game === 'zeus') {
          showScreen('slots'); 
          document.getElementById('slot-msg').textContent = "";
          document.getElementById('last-win').textContent = "$0.00";
          // Заполняем картинками
          for (let i=0; i<30; i++) {
              let img = document.createElement('img');
              img.src = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
              img.className = 'symbol-img';
              document.getElementById(`c${i}`).innerHTML = '';
              document.getElementById(`c${i}`).appendChild(img);
          }
      } else if (game === 'blackjack') { showScreen('blackjack'); } 
      else if (game === 'roulette') { showScreen('roulette'); } 
      else if (game === 'crash') { showScreen('crash'); }
  }

  function setBet(amount, btn) { 
      currentBet = amount; 
      document.querySelectorAll('#screen-slots .bet-btn').forEach(b => b.classList.remove('active')); 
      btn.classList.add('active'); 
  }

  function spin() {
    if (balance < currentBet) return document.getElementById('slot-msg').innerHTML = '<span class="lose-text">МАЛО СРЕДСТВ</span>';
    
    balance -= currentBet; updateBal();
    const msg = document.getElementById('slot-msg'); const grid = document.getElementById('reels');
    const winBanner = document.getElementById('last-win');
    
    msg.textContent = ""; winBanner.textContent = "$0.00";
    grid.classList.add('spinning');

    setTimeout(() => {
        grid.classList.remove('spinning');
        
        let winChance = currentSpins < 8 ? 0.85 : 0.15;
        let isWin = Math.random() < winChance;
        
        let finalSymbols = [];
        if (isWin) {
            let winSym = SYMBOLS[Math.floor(Math.random() * 4)]; // Выигрышные символы
            // Выигрышная линия по центру (12,13,14,15,16,17)
            for (let i = 0; i < 30; i++) {
                if (i >= 12 && i <= 17) finalSymbols.push(winSym);
                else finalSymbols.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
            }
        } else {
            do {
                finalSymbols = [];
                for (let i = 0; i < 30; i++) finalSymbols.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
            } while ((finalSymbols[12] === finalSymbols[13] && finalSymbols[13] === finalSymbols[14]));
        }

        // Отрисовка финальных картинок
        for (let i = 0; i < 30; i++) {
            let img = document.createElement('img');
            img.src = finalSymbols[i];
            img.className = 'symbol-img';
            // Если картинка не загрузилась, ставим alt
            img.alt = "?";
            document.getElementById(`c${i}`).innerHTML = '';
            document.getElementById(`c${i}`).appendChild(img);
        }

        if (isWin) {
            let mult = Math.random() > 0.7 ? 3 : 2; 
            let payout = currentBet * mult;
            balance += payout; updateBal();
            winBanner.textContent = "$" + payout.toFixed(2);
            msg.innerHTML = `<span class="win-text">ВЫИГРЫШ +${payout} (x${mult})</span>`;
        } else {
            msg.innerHTML = `<span class="lose-text">ПРОИГРЫШ -${currentBet}</span>`;
        }
        currentSpins++; localStorage.setItem('royal_spins', currentSpins);
        updateBal(); 
    }, 1000);
  }

  updateBal();
</script>
</body>
</html>
