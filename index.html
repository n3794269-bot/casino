<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: var(--tg-theme-bg-color, #0a0a0f); --text: var(--tg-theme-text-color, #f0f0f5); --hint: var(--tg-theme-hint-color, #7a7a8a); --accent: #ffb800; --win: #00e676; --lose: #ff3d57; --gold: linear-gradient(135deg, #ffd700, #ffb800 40%, #ff8c00); --card: linear-gradient(145deg, rgba(30,30,45,0.95), rgba(15,15,25,0.95)); --glass: rgba(255,255,255,0.06); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); background-image: radial-gradient(circle at 20% 0%, rgba(255,184,0,0.08), transparent 50%), radial-gradient(circle at 80% 100%, rgba(255,107,0,0.08), transparent 50%); color: var(--text); padding-bottom: 80px; min-height: 100vh; }
  .header { position: sticky; top: 0; z-index: 50; padding: 14px 18px; background: rgba(10,10,15,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,184,0,0.15); display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 18px; font-weight: 800; background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .balance-pill { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid rgba(255,184,0,0.3); padding: 8px 14px; border-radius: 999px; font-size: 15px; font-weight: 700; box-shadow: 0 0 20px rgba(255,184,0,0.15); }
  .admin-crown { background: var(--gold); color: #000; font-weight: 800; padding: 6px 12px; border-radius: 999px; font-size: 12px; }
  .content { padding: 18px; max-width: 500px; margin: 0 auto; }
  .hidden { display: none !important; }
  h2 { font-size: 22px; margin: 6px 0 18px; background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  h3 { font-size: 16px; margin: 12px 0 10px; }
  .btn { padding: 14px 20px; border-radius: 14px; border: none; background: var(--gold); color: #1a1a1a; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform 0.1s; box-shadow: 0 4px 20px rgba(255,140,0,0.3); }
  .btn:active { transform: scale(0.96); }
  .btn-sec { background: var(--glass); color: var(--text); border: 1px solid rgba(255,255,255,0.12); box-shadow: none; }
  .btn-ghost { background: transparent; color: var(--hint); box-shadow: none; }
  .slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .slot-card { border-radius: 18px; padding: 18px 14px; text-align: center; cursor: pointer; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); transition: transform 0.15s; min-height: 110px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .slot-card:active { transform: scale(0.95); }
  .slot-card .slot-emoji { font-size: 36px; margin-bottom: 8px; }
  .slot-card .slot-name { font-size: 14px; font-weight: 700; }
  .slot-card .slot-mult { font-size: 11px; color: var(--accent); margin-top: 4px; }
  .reels-wrap { margin: 20px 0; padding: 24px 16px; border-radius: 20px; background: linear-gradient(145deg, #000, #1a1a25); border: 2px solid rgba(255,184,0,0.25); box-shadow: inset 0 0 40px rgba(255,184,0,0.1), 0 8px 30px rgba(0,0,0,0.5); display: flex; justify-content: center; gap: 10px; min-height: 130px; align-items: center; }
  .reel { font-size: 52px; width: 70px; height: 90px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); }
  .reel.spinning { animation: spinblur 0.1s infinite; }
  @keyframes spinblur { 0%,100% { transform: translateY(0); filter: blur(0); } 50% { transform: translateY(-6px); filter: blur(2px); } }
  .reel.win { animation: pop 0.4s; box-shadow: 0 0 20px var(--accent); }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }
  .msg { text-align: center; padding: 12px; font-size: 16px; font-weight: 700; min-height: 28px; }
  .win-text { color: var(--win); text-shadow: 0 0 15px rgba(0,230,118,0.6); }
  .lose-text { color: var(--lose); }
  .bet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .bet-btn { padding: 18px; border-radius: 14px; border: 1px solid rgba(255,184,0,0.2); background: var(--card); color: var(--text); font-size: 18px; font-weight: 800; cursor: pointer; transition: transform 0.1s; }
  .bet-btn:active { transform: scale(0.95); border-color: var(--accent); }
  .bet-coin { font-size: 12px; color: var(--hint); display: block; margin-top: 2px; font-weight: 500; }
  .cards-row { display: flex; gap: 8px; justify-content: center; margin: 14px 0; flex-wrap: wrap; min-height: 100px; align-items: center; }
  .card { width: 64px; height: 90px; border-radius: 10px; background: linear-gradient(145deg, #fff, #e8e8e8); color: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
  .card.red { color: #d32f2f; }
  .card.back { background: linear-gradient(135deg, #1a237e, #283593); color: transparent; }
  .hand-label { text-align: center; color: var(--hint); font-size: 13px; margin: 8px 0 4px; }
  .hand-total { text-align: center; font-weight: 700; font-size: 15px; color: var(--accent); }
  .roulette-colors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .roul-btn { padding: 22px; border-radius: 16px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; color: #fff; transition: transform 0.1s; }
  .roul-btn.red { background: linear-gradient(135deg, #ff3d57, #c62828); }
  .roul-btn.black { background: linear-gradient(135deg, #2a2a35, #000); }
  .roul-btn.green { background: linear-gradient(135deg, #00e676, #00897b); grid-column: 1/-1; }
  .roul-btn:active { transform: scale(0.95); }
  .crash-display { text-align: center; padding: 40px 20px; border-radius: 20px; background: var(--card); border: 2px solid rgba(255,184,0,0.2); margin: 16px 0; }
  .crash-mult { font-size: 64px; font-weight: 900; background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
  .crash-mult.crashed { background: linear-gradient(135deg, #ff3d57, #c62828); -webkit-background-clip: text; background-clip: text; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: rgba(10,10,15,0.92); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,184,0,0.15); display: flex; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); }
  .tab { flex: 1; padding: 8px 4px; text-align: center; cursor: pointer; font-size: 11px; color: var(--hint); font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tab .tab-icon { font-size: 20px; }
  .tab.active { color: var(--accent); }
  .profile-card { padding: 20px; border-radius: 18px; background: var(--card); border: 1px solid rgba(255,184,0,0.15); text-align: center; margin-bottom: 14px; }
  .profile-bal { font-size: 42px; font-weight: 900; background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.1; }
  .profile-label { color: var(--hint); font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
<div class="header">
  <div class="brand">🎰 LUCKY SPIN</div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="balance-pill"><span>💰</span><span id="bal">0</span></div>
  </div>
</div>

<div class="content">
  <!-- SLOTS -->
  <div id="tab-slots">
    <h2>Слоты</h2>
    <div class="slot-grid" id="slot-list"></div>
    <div id="slot-game" class="hidden">
      <button class="btn btn-sec" onclick="backToSlots()" style="margin-bottom:14px;padding:10px 16px;font-size:14px">← Все слоты</button>
      <h3 id="slot-title" style="text-align:center"></h3>
      <div class="reels-wrap">
        <div class="reel" id="r1">❓</div>
        <div class="reel" id="r2">❓</div>
        <div class="reel" id="r3">❓</div>
      </div>
      <div class="msg" id="slot-msg"></div>
      <div class="bet-grid">
        <button class="bet-btn" onclick="spin(100)">100<span class="bet-coin">ставка</span></button>
        <button class="bet-btn" onclick="spin(500)">500<span class="bet-coin">ставка</span></button>
        <button class="bet-btn" onclick="spin(1000)">1000<span class="bet-coin">ставка</span></button>
        <button class="bet-btn" onclick="spin(5000)">5000<span class="bet-coin">ставка</span></button>
      </div>
    </div>
  </div>

  <!-- BLACKJACK -->
  <div id="tab-blackjack" class="hidden">
    <h2>Блэкджек</h2>
    <div id="bj-start">
      <p style="color:var(--hint);margin-bottom:14px">Набери 21 или ближе к нему, чем дилер</p>
      <div class="bet-grid">
        <button class="bet-btn" onclick="bjStart(100)">100<span class="bet-coin">ставка</span></button>
        <button class="bet-btn" onclick="bjStart(500)">500<span class="bet-coin">ставка</span></button>
        <button class="bet-btn" onclick="bjStart(1000)">1000<span class="bet-coin">ставка</span></button>
        <button class="bet-btn" onclick="bjStart(5000)">5000<span class="bet-coin">ставка</span></button>
      </div>
    </div>
    <div id="bj-game" class="hidden">
      <div class="hand-label">Дилер</div>
      <div class="cards-row" id="bj-dealer"></div>
      <div class="hand-total" id="bj-dealer-total"></div>
      <div class="hand-label">Ты</div>
      <div class="cards-row" id="bj-player"></div>
      <div class="hand-total" id="bj-player-total"></div>
      <div class="msg" id="bj-msg"></div>
      <div id="bj-actions" class="hidden bet-grid">
        <button class="bet-btn" onclick="bjAct('hit')" style="background:linear-gradient(135deg,#00e676,#00897b);color:#000">Взять</button>
        <button class="bet-btn" onclick="bjAct('stand')" style="background:linear-gradient(135deg,#ff3d57,#c62828);color:#fff">Хватит</button>
      </div>
    </div>
  </div>

  <!-- ROULETTE -->
  <div id="tab-roulette" class="hidden">
    <h2>Рулетка</h2>
    <div id="roul-start">
      <p style="color:var(--hint);margin-bottom:14px">Выбери ставку</p>
      <div class="bet-grid">
        <button class="bet-btn" onclick="setRoulAmt(100)">100</button>
        <button class="bet-btn" onclick="setRoulAmt(500)">500</button>
        <button class="bet-btn" onclick="setRoulAmt(1000)">1000</button>
        <button class="bet-btn" onclick="setRoulAmt(5000)">5000</button>
      </div>
      <div id="roul-pick" class="hidden" style="margin-top:20px">
        <p style="text-align:center;color:var(--accent);font-weight:700;margin-bottom:12px">Ставка: <span id="roul-amt">0</span></p>
        <div class="roulette-colors">
          <button class="roul-btn red" onclick="roulSpin('red')">🔴 Красное<br><small>x2</small></button>
          <button class="roul-btn black" onclick="roulSpin('black')">⚫ Чёрное<br><small>x2</small></button>
          <button class="roul-btn green" onclick="roulSpin('green')">🟢 Зелёное<br><small>x14</small></button>
        </div>
      </div>
      <div class="msg" id="roul-msg"></div>
    </div>
  </div>

  <!-- CRASH -->
  <div id="tab-crash" class="hidden">
    <h2>Краш</h2>
    <div id="crash-start">
      <p style="color:var(--hint);margin-bottom:14px">Множитель растёт. Забери до краша!</p>
      <div class="bet-grid">
        <button class="bet-btn" onclick="crashStart(100)">100</button>
        <button class="bet-btn" onclick="crashStart(500)">500</button>
        <button class="bet-btn" onclick="crashStart(1000)">1000</button>
        <button class="bet-btn" onclick="crashStart(5000)">5000</button>
      </div>
    </div>
    <div id="crash-game" class="hidden">
      <div class="crash-display"><div class="crash-mult" id="crash-mult">1.00x</div></div>
      <button class="btn" style="width:100%" onclick="crashCash()">Забрать</button>
      <div class="msg" id="crash-msg"></div>
    </div>
  </div>

  <!-- PROFILE -->
  <div id="tab-profile" class="hidden">
    <h2>Профиль</h2>
    <div class="profile-card">
      <div class="profile-bal" id="prof-bal">0</div>
      <div class="profile-label">монет на балансе</div>
    </div>
    <button class="btn" style="width:100%;margin-bottom:10px" onclick="showDeposit()">💰 Пополнить</button>
    <button class="btn btn-sec" style="width:100%;margin-bottom:18px" onclick="tg.close()">💸 Вывод (В боте)</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="slots" onclick="switchTab('slots')"><span class="tab-icon">🎰</span>Слоты</div>
  <div class="tab" data-tab="blackjack" onclick="switchTab('blackjack')"><span class="tab-icon">🃏</span>Блэкджек</div>
  <div class="tab" data-tab="roulette" onclick="switchTab('roulette')"><span class="tab-icon">🎡</span>Рулетка</div>
  <div class="tab" data-tab="crash" onclick="switchTab('crash')"><span class="tab-icon">📈</span>Краш</div>
  <div class="tab" data-tab="profile" onclick="switchTab('profile')"><span class="tab-icon">👤</span>Профиль</div>
</div>

<script>
  const tg = Telegram.WebApp;
  tg.ready(); tg.expand();
  let balance = 1000;
  let currentSlot = null;
  let roulAmount = 0;
  let crashState = null;
  let bjState = null;

  // СЛОТЫ
  const SLOTS = {
    "zeus": {"name":"⚡ Зевс", "symbols":["⚡","🏛️","🍇","🏺","👑"], "bg":"linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)"},
    "pharaoh": {"name":"🐫 Фараон", "symbols":["🐫","🏺","🐍","☀️","👁️"], "bg":"linear-gradient(135deg,#3e2723,#5d4037,#8d6e63)"},
    "dragon": {"name":"🐉 Дракон", "symbols":["🐉","🔥","💎","🏮","🎋"], "bg":"linear-gradient(135deg,#b71c1c,#d32f2f,#f57c00)"},
    "classic": {"name":"🎰 Классика", "symbols":["🍒","🍋","🍊","🔔","7️⃣"], "bg":"linear-gradient(135deg,#1b5e20,#2e7d32,#388e3c)"},
    "space": {"name":"🌌 Космос", "symbols":["🚀","🌙","⭐","🪐","👽"], "bg":"linear-gradient(135deg,#000428,#004e92,#000428)"},
    "dead": {"name":"💀 Мёртвый", "symbols":["💀","🦴","🕷️","🕸️","🩸"], "bg":"linear-gradient(135deg,#1a0000,#330000,#4d0000)"}
  };

  function updateBal(b) {
    balance = b;
    document.getElementById("bal").textContent = b.toLocaleString('ru');
    document.getElementById("prof-bal").textContent = b.toLocaleString('ru');
  }

  function switchTab(t) {
    document.querySelectorAll(".content > div").forEach(d => d.classList.add("hidden"));
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.getElementById("tab-"+t).classList.remove("hidden");
    document.querySelector('.tab[data-tab="'+t+'"]').classList.add("active");
  }

  // ИНИЦИАЛИЗАЦИЯ СЛОТОВ
  const list = document.getElementById("slot-list");
  for (const [key, s] of Object.entries(SLOTS)) {
    const d = document.createElement("div");
    d.className = "slot-card";
    d.style.background = s.bg;
    d.innerHTML = `<div class="slot-emoji">${s.symbols[0]}</div><div class="slot-name">${s.name}</div>`;
    d.onclick = () => openSlot(key);
    list.appendChild(d);
  }

  function openSlot(key) {
    currentSlot = key;
    document.getElementById("slot-list").classList.add("hidden");
    document.getElementById("slot-game").classList.remove("hidden");
    document.getElementById("slot-title").textContent = SLOTS[key].name;
    document.getElementById("slot-msg").textContent = "";
  }
  function backToSlots() {
    document.getElementById("slot-list").classList.remove("hidden");
    document.getElementById("slot-game").classList.add("hidden");
  }

  function spin(amount) {
    if (balance < amount) return document.getElementById("slot-msg").innerHTML = '<span class="lose-text">Мало монет!</span>';
    updateBal(balance - amount);
    const s = SLOTS[currentSlot];
    const reels = [document.getElementById("r1"), document.getElementById("r2"), document.getElementById("r3")];
    document.getElementById("slot-msg").textContent = "";
    reels.forEach(r => r.classList.add("spinning"));
    
    setTimeout(() => {
      reels.forEach(r => r.classList.remove("spinning"));
      const win = Math.random() < 0.4; // Шанс выигрыша
      if (win) {
        const sym = s.symbols[Math.floor(Math.random() * 3)];
        reels.forEach(r => { r.textContent = sym; r.classList.add("win"); setTimeout(()=>r.classList.remove("win"),500); });
        const payout = amount * 5;
        updateBal(balance + payout);
        document.getElementById("slot-msg").innerHTML = `<span class="win-text">🎉 +${payout}</span>`;
      } else {
        reels.forEach(r => r.textContent = s.symbols[Math.floor(Math.random() * 5)]);
        document.getElementById("slot-msg").innerHTML = `<span class="lose-text">😢 -${amount}</span>`;
      }
    }, 600);
  }

  // ДЕПОЗИТ
  function showDeposit() {
    tg.showAlert("Чтобы пополнить баланс, вернись в чат с ботом и нажми кнопку 'Пополнить'!");
    tg.close();
  }

  // РУЛЕТКА
  function setRoulAmt(a) {
    roulAmount = a;
    document.getElementById("roul-pick").classList.remove("hidden");
    document.getElementById("roul-amt").textContent = a;
  }
  function roulSpin(color) {
    if (balance < roulAmount) return document.getElementById("roul-msg").innerHTML = '<span class="lose-text">Мало монет!</span>';
    updateBal(balance - roulAmount);
    const win = Math.random() < 0.45;
    const m = document.getElementById("roul-msg");
    if (win) {
      const payout = roulAmount * 2;
      updateBal(balance + payout);
      m.innerHTML = `<span class="win-text">🎉 Победа! +${payout}</span>`;
    } else {
      m.innerHTML = `<span class="lose-text">😢 Проигрыш -${roulAmount}</span>`;
    }
  }

  // БЛЭКДЖЕК
  function bjStart(amount) {
    if (balance < amount) return alert("Мало монет!");
    updateBal(balance - amount);
    document.getElementById("bj-start").classList.add("hidden");
    document.getElementById("bj-game").classList.remove("hidden");
    document.getElementById("bj-actions").classList.remove("hidden");
    bjState = {amount, player: [5, 7], dealer: [8, 6]};
    renderBj();
  }
  function renderBj() {
    document.getElementById("bj-player").innerHTML = bjState.player.map(c=>`<div class="card">${c}</div>`).join("");
    document.getElementById("bj-dealer").innerHTML = bjState.dealer.map(c=>`<div class="card">${c}</div>`).join("");
  }
  function bjAct(act) {
    if (act === 'hit') {
      bjState.player.push(Math.floor(Math.random()*10)+1);
      if (bjState.player.reduce((a,b)=>a+b,0) > 21) {
        document.getElementById("bj-msg").innerHTML = '<span class="lose-text">Перебор!</span>';
        endBj();
      } else renderBj();
    } else {
      const p = bjState.player.reduce((a,b)=>a+b,0);
      const d = bjState.dealer.reduce((a,b)=>a+b,0);
      if (p > d) {
        document.getElementById("bj-msg").innerHTML = '<span class="win-text">Победа!</span>';
        updateBal(balance + bjState.amount*2);
      } else {
        document.getElementById("bj-msg").innerHTML = '<span class="lose-text">Дилер победил</span>';
      }
      endBj();
    }
  }
  function endBj() {
    document.getElementById("bj-actions").classList.add("hidden");
    setTimeout(() => {
      document.getElementById("bj-start").classList.remove("hidden");
      document.getElementById("bj-game").classList.add("hidden");
      document.getElementById("bj-msg").textContent = "";
    }, 2000);
  }

  // КРАШ
  function crashStart(amount) {
    if (balance < amount) return alert("Мало монет!");
    updateBal(balance - amount);
    document.getElementById("crash-start").classList.add("hidden");
    document.getElementById("crash-game").classList.remove("hidden");
    crashState = {amount, mult: 1.0, crashAt: Math.random()*3 + 1, timer: null, done: false};
    document.getElementById("crash-mult").textContent = "1.00x";
    
    crashState.timer = setInterval(() => {
      crashState.mult += 0.05;
      document.getElementById("crash-mult").textContent = crashState.mult.toFixed(2) + "x";
      if (crashState.mult >= crashState.crashAt) {
        clearInterval(crashState.timer);
        crashState.done = true;
        document.getElementById("crash-mult").textContent = "💥 " + crashState.crashAt.toFixed(2) + "x";
        document.getElementById("crash-msg").innerHTML = '<span class="lose-text">Краш!</span>';
        setTimeout(() => { document.getElementById("crash-start").classList.remove("hidden"); document.getElementById("crash-game").classList.add("hidden"); }, 2000);
      }
    }, 100);
  }
  function crashCash() {
    if (crashState.done) return;
    crashState.done = true;
    clearInterval(crashState.timer);
    const payout = Math.floor(crashState.amount * crashState.mult);
    updateBal(balance + payout);
    document.getElementById("crash-msg").innerHTML = `<span class="win-text">Забрал +${payout}</span>`;
    setTimeout(() => { document.getElementById("crash-start").classList.remove("hidden"); document.getElementById("crash-game").classList.add("hidden"); }, 2000);
  }

  updateBal(balance);
</script>
</body>
</html>
