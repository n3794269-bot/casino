<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #0a0a0f; --text: #f0f0f5; --accent: #ffb800; --win: #00e676; --lose: #ff3d57; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; text-align: center; }
  .header { display: flex; justify-content: space-between; padding: 20px; border-bottom: 1px solid #222; align-items: center; }
  .brand { font-size: 18px; font-weight: 800; color: var(--accent); }
  .balance { background: #15151f; padding: 8px 14px; border-radius: 20px; font-weight: bold; border: 1px solid var(--accent); }
  .slot { background: #15151f; border-radius: 20px; padding: 30px 20px; margin: 20px auto; max-width: 400px; border: 1px solid #333; }
  .reels { font-size: 60px; letter-spacing: 10px; margin: 20px 0; text-shadow: 0 0 20px var(--accent); }
  .reels.spinning { animation: shake 0.1s infinite; }
  @keyframes shake { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  .btn { padding: 15px 25px; border-radius: 12px; background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; font-weight: bold; border: none; margin: 5px; font-size: 16px; cursor: pointer; }
  .btn:active { transform: scale(0.95); }
  .btn-dep { background: linear-gradient(135deg, #00e676, #00897b); color: #000; width: 90%; margin: 20px auto; display: block; }
  .msg { height: 30px; font-weight: bold; font-size: 18px; margin-top: 10px; }
</style>
</head>
<body>
<div class="header">
  <div class="brand">🎰 LUCKY SPIN</div>
  <div class="balance">💰 <span id="bal">0</span></div>
</div>

<div style="padding: 20px;">
  <div class="slot">
    <h2 style="color: var(--accent);">⚡ Зевс</h2>
    <div class="reels" id="reels">❓ ❓ ❓</div>
    <div class="msg" id="msg"></div>
    <div>
      <button class="btn" onclick="spin(100)">100</button>
      <button class="btn" onclick="spin(500)">500</button>
      <button class="btn" onclick="spin(1000)">1000</button>
    </div>
  </div>
  
  <button class="btn btn-dep" onclick="deposit()">💰 Пополнить баланс</button>
</div>

<script>
  const tg = Telegram.WebApp;
  tg.ready(); tg.expand();

  let balance = parseInt(localStorage.getItem('balance')) || 1000;
  let spins = parseInt(localStorage.getItem('spins')) || 0;
  document.getElementById('bal').textContent = balance.toLocaleString('ru');

  function updateBal() {
    localStorage.setItem('balance', balance);
    document.getElementById('bal').textContent = balance.toLocaleString('ru');
  }

  function spin(amount) {
    if (balance < amount) {
      document.getElementById('msg').innerHTML = '<span style="color:var(--lose)">Недостаточно монет!</span>';
      return;
    }

    balance -= amount;
    updateBal();
    document.getElementById('reels').classList.add('spinning');
    document.getElementById('msg').textContent = "";

    setTimeout(() => {
      document.getElementById('reels').classList.remove('spinning');
      
      let winChance = spins < 8 ? 0.85 : 0.25;
      let win = Math.random() < winChance;
      
      if (win) {
        let symbols = ["⚡","🏛️","🍇","🏺","👑"];
        let sym = symbols[Math.floor(Math.random() * 2)];
        document.getElementById('reels').textContent = `${sym} ${sym} ${sym}`;
        
        let mult = sym === "⚡" ? 25 : 10;
        let payout = amount * mult;
        balance += payout;
        updateBal();
        document.getElementById('msg').innerHTML = `<span style="color:var(--win)">🎉 +${payout} (x${mult})</span>`;
      } else {
        document.getElementById('reels').textContent = "🍋 🍇 🏺";
        document.getElementById('msg').innerHTML = `<span style="color:var(--lose)">😢 -${amount}</span>`;
      }
      
      spins++;
      localStorage.setItem('spins', spins);
    }, 600);
  }

  function deposit() {
    tg.close();
  }
</script>
</body>
</html>
